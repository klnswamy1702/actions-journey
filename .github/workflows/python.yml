name: Hello Workflow
on: [push]
jobs:
  hello_job:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello, GitHub Actions!"
        
      - name: Setup Java JDK
        uses: actions/setup-java@v4 # Use a stable major version (e.g., v4)
        with:
          distribution: 'temurin'   # REQUIRED: Choose a distribution (temurin, zulu, microsoft, etc.)
          java-version: '21'        # REQUIRED: Specify the Java version
          
      - name: Setup Python
        uses: actions/setup-python@v5 # Use a stable major version (e.g., v5)
        with:
          python-version: '3.12'    # RECOMMENDED: Specify the Python version
